name: CI

on:
  push:
    branches: [main, hyperliquid]
  pull_request:
    branches: [main, hyperliquid]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm add @factordao/tokenlist

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: >-
          pnpm vitest run
          tests/create-vault.test.ts
          tests/vault-analytics-morpho.test.ts
